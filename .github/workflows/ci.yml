name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare apt cache
        run: |
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          chmod -R u+rwX "$RUNNER_TEMP/apt-archives"
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ runner.os }}-apt-v1-${{ hashFiles('.github/workflows/ci.yml', '.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-v1-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" \
            install -y cmake pkg-config libsndfile1-dev libsdl2-dev libsdl2-ttf-dev
          sudo chmod -R a+rX "$RUNNER_TEMP/apt-archives"
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DVWAVE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            git
            pkgconf
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVWAVE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
